[versions]
# Build
idea-gradle = "1.2"
shadow = "9.4.1"

# Common
joml = "1.10.8"
gson = "2.10.1"
semver = "3.1.0"
fastutil = "8.5.18"
guava = "32.1.2-jre"
commons-lang3 = "3.14.0"
log4j = "2.22.1"

dataFixerUpper = "8.0.16"
brigadier = "1.3.10"

fastutil-concurrent-wrapper = "0.2.3"

[plugins]
idea-gradle = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-gradle" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]

joml = { module = "org.joml:joml", version.ref = "joml" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
semver = { module = "com.vdurmont:semver4j", version.ref = "semver" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }

fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
fastutil-concurrent-wrapper = { module = "com.trivago:fastutil-concurrent-wrapper", version.ref = "fastutil-concurrent-wrapper" }

dataFixerUpper = { module = "com.mojang:datafixerupper", version.ref = "dataFixerUpper" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
